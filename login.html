
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Sign In | MUSE</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="auth-body">

    <!-- Background effects -->
    <div class="auth-background" aria-hidden="true">
        <div class="auth-orb pink"></div>
        <div class="auth-orb purple"></div>
        <div class="auth-orb blue"></div>
    </div>

    <!-- Main login card -->
    <main class="auth-page" id="auth-card">

        <!-- MUSE tagline -->
        <header class="auth-heading">
            <p class="auth-tagline">
                Where movement meets <span>memory.</span>
            </p>
        </header>

        <section id="auth-forms">

            <!-- SIGN IN FORM -->
            <form id="sign-in-form" class="auth-form">

                <h2>Sign In</h2>

                <label for="sign-in-email">Email</label>
                <input
                    id="sign-in-email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="sign-in-password">Password</label>
                <input
                    id="sign-in-password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

                <button class="auth-button" type="submit">
                    Sign In
                </button>

                <p class="auth-reset">
                    <button id="reset-password-button" type="button">
                        Forgot password?
                    </button>
                </p>

                <p class="auth-switch">
                    Don't have an account?
                    <button id="show-sign-up" type="button">
                        Create Account
                    </button>
                </p>

            </form>

            <!-- CREATE ACCOUNT FORM -->
            <form id="sign-up-form" class="auth-form" hidden>

                <h2>Create Account</h2>

                <label for="display-name">Display Name</label>
                <input
                    id="display-name"
                    type="text"
                    autocomplete="nickname"
                    maxlength="50"
                    placeholder="Choose a display name"
                    required
                >

                <label for="sign-up-email">Email</label>
                <input
                    id="sign-up-email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="sign-up-password">Password</label>
                <input
                    id="sign-up-password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Create a password (8+ characters)"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    id="confirm-password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Enter your password again"
                    required
                >

                <button class="auth-button" type="submit">
                    Create Account
                </button>

                <p class="auth-switch">
                    Already have an account?
                    <button id="show-sign-in" type="button">
                        Sign In
                    </button>
                </p>

            </form>

        </section>

        <!-- SIGNED-IN PANEL -->
        <section id="signed-in-panel" hidden>

            <h2>You're signed in!</h2>

            <p id="welcome-message"></p>

            <button
                id="logout-button"
                class="auth-button"
                type="button"
            >
                Log Out
            </button>

            <a href="index.html" class="auth-home-link">
                Return to MUSE
            </a>

        </section>

        <!-- Status messages -->
        <p
            id="auth-message"
            class="auth-message"
            role="status"
            aria-live="polite"
        ></p>

        <!-- Return to homepage -->
        <a href="index.html" class="auth-home-link">
            Back to Home
        </a>

    </main>

</body>
</html>
